name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run blocking quick tests
        run: >-
          python -m pytest -q
          tests/test_release_contract.py
          tests/test_function_call_agent_unit.py
          tests/test_simple_calculator.py::test_calculator_tool

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify_release_artifact.py "$wheel"

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv --system-site-packages "$RUNNER_TEMP/lingye-smoke"
          "$RUNNER_TEMP/lingye-smoke/bin/python" -m pip install --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lingye-smoke/bin/python" -c "from lingye_agent import __version__; from lingye_agent.tools import create_calculator_registry; assert __version__ == '0.1.0'; assert '4' in str(create_calculator_registry().execute_tool('simple_calculate', 'sqrt(16)'))"
