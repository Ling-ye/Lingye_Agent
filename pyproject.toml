[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingye-agent"
version = "0.1.0"
description = "Modular Python framework for LLM agents with multiple agent patterns, memory, RAG, MCP, and context engineering."
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lingye" }]
keywords = ["llm", "ai-agents", "rag", "mcp", "memory", "context-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tiktoken>=0.9.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
rag = [
    "qdrant-client>=1.6.0",
    "sentence-transformers>=2.5.0",
    "scikit-learn>=1.3.0",
]
graph = ["neo4j>=5.0.0"]
mcp = ["fastmcp>=2.0.0"]
nlp = ["jieba>=0.42.1", "dashscope>=1.14.0"]
doc = ["markitdown[pdf]>=0.0.1a3"]
ui = ["gradio>=4.0.0"]
all = ["lingye-agent[rag,graph,mcp,nlp,doc,ui]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.2.2",
    "twine>=5.1.1",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Ling-ye/Lingye_Agent"
Repository = "https://github.com/Ling-ye/Lingye_Agent"
Documentation = "https://github.com/Ling-ye/Lingye_Agent/blob/main/docs/guide.en.md"
Issues = "https://github.com/Ling-ye/Lingye_Agent/issues"
Changelog = "https://github.com/Ling-ye/Lingye_Agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["lingye_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.vscode",
    "/AGENTS.md",
    "/my_main.py",
    "/todo.md",
]
